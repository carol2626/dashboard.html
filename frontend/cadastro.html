<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>
  
  <style>
    /* 🎨 RESET DE ESTILOS */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* 🌆 FUNDO MODERNO COM DEGRADÊ */
    body.cadastro-page {
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    /* 🪟 CONTAINER EFEITO VIDRO (GLASSMORPHISM) */
    .form-container {
      width: 100%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      padding: 30px;
    }

    /* ✍️ TÍTULOS */
    .form-box h2 {
      color: #1e1b4b;
      font-size: 28px;
      text-align: center;
      margin-bottom: 25px;
      font-weight: 700;
    }

    .form-box h3 {
      color: #4f46e5;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 25px 0 12px 0;
      border-bottom: 2px solid #e0e7ff;
      padding-bottom: 5px;
    }

    /* 📐 ALINHAMENTO LADO A LADO */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    /* ⌨️ CAMPOS DE ENTRADA (INPUTS E SELECTS) */
    input[type="text"],
    input[type="email"],
    input[type="password"],
    select {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background-color: #fff;
      color: #334155;
      font-size: 15px;
      transition: all 0.3s ease;
      outline: none;
    }

    /* ✨ FOCO NOS CAMPOS */
    input:focus, 
    select:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
      background-color: #f8fafc;
    }

    /* 🚀 BOTÃO DE CADASTRAR */
    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #4f46e5, #06b6d4);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      margin-top: 15px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    button[type="submit"]:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    button[type="submit"]:active {
      transform: translateY(1px);
    }

    /* 🔗 LINKS E TEXTOS DE BAIXO */
    .voltar {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #64748b;
    }

    .voltar a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 600;
    }

    .voltar a:hover {
      text-decoration: underline;
    }

    /* 🔔 MENSAGEM DE ERRO/SUCESSO */
    #mensagem {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      font-weight: 500;
    }

    /* 📱 ADAPTAÇÃO PARA CELULAR */
    @media (max-width: 480px) {
      .grid-2 {
        grid-template-columns: 1fr;
        gap: 0;
      }
      .form-container {
        padding: 20px;
      }
    }
  </style>
</head>

<body class="cadastro-page">

  <div class="form-container">

    <div class="form-box">

      <h2>Criar Conta</h2>

      <form id="registerForm">

        <h3>Dados pessoais</h3>

        <input 
          id="nome" 
          type="text" 
          placeholder="Digite seu nome completo" 
          required
        >

        <div class="grid-2">

          <input 
            id="dataNascimento" 
            type="text" 
            placeholder="Data de nascimento (dd/mm/aaaa)" 
            required
          >

          <input 
            id="cpf" 
            type="text" 
            placeholder="Digite seu CPF" 
            required
          >

        </div>

        <div class="grid-2">

          <select id="genero">
            <option value="">Gênero</option>
            <option>Feminino</option>
            <option>Masculino</option>
            <option>Outro</option>
          </select>

          <select id="cor">
            <option value="">Cor</option>
            <option>Branca</option>
            <option>Preta</option>
            <option>Parda</option>
            <option>Amarela</option>
            <option>Indígena</option>
          </select>

        </div>

        <h3>Endereço</h3>

        <div class="grid-2">
          <input id="pais" type="text" placeholder="Digite seu país">
          <input id="estado" type="text" placeholder="Estado">
        </div>

        <div class="grid-2">
          <input id="cidade" type="text" placeholder="Cidade">
          <input id="cep" type="text" placeholder="CEP">
        </div>

        <input 
          id="endereco" 
          type="text" 
          placeholder="Endereço completo"
        >

        <h3>Dados Acadêmicos</h3>

        <div class="grid-2">
          <input 
            id="instituicao" 
            type="text" 
            placeholder="Instituição"
          >

          <input 
            id="curso" 
            type="text" 
            placeholder="Curso / Disciplina"
          >
        </div>

        <div class="grid-2">

          <input 
            id="periodo" 
            type="text" 
            placeholder="Período"
          >

          <input 
            id="formatura" 
            type="text" 
            placeholder="Previsão de formatura (dd/mm/aaaa)"
          >

        </div>

        <h3>Objetivo</h3>

        <input 
          id="vaga" 
          type="text" 
          placeholder="Vaga desejada"
        >

        <h3>Dados de acesso</h3>

        <input 
          id="emailCadastro" 
          type="email" 
          placeholder="Digite seu e-mail" 
          required
        >

        <input 
          id="senhaCadastro" 
          type="password" 
          placeholder="Crie uma senha" 
          required
        >

        <input 
          id="confirmarSenha" 
          type="password" 
          placeholder="Confirme sua senha" 
          required
        >

        <button type="submit">
          Cadastrar
        </button>

      </form>

      <p id="mensagem"></p>

      <p class="voltar">
        Já tem conta? <a href="index.html">Fazer login</a>
      </p>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
